<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Skins - ZZZ Edition</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e12">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Teko:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <header class="zzz-header">
    <div class="title-container">
      <span class="sub-tag">// SIGNAL_STORE.V3</span>
      <h1>TIENDA DE SKINS</h1>
    </div>
    <p id="status-text">[ CONECTANDO CON FIREBASE... ]</p>
    <p id="user-greeting" style="display:none;"></p>
    <p id="coins-text" class="coins-badge" style="display:none;"></p>
    <button id="logout-btn" class="logout-btn" style="display:none;">Cerrar sesión</button>
  </header>

  <nav class="store-tabs" id="store-tabs" style="display:none;">
    <button type="button" class="store-tab active" data-view="tienda">Tienda</button>
    <button type="button" class="store-tab" data-view="comprados">Comprados</button>
  </nav>

  <main id="skins-grid" class="store-view active"></main>
  <main id="comprados-grid" class="store-view"></main>

  <script type="module" src="app.js"></script>

</body>
</html>
